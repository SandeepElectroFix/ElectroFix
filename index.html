<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Sandeep ElectroFix — Project List</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loading-screen">

  <div class="loading-wrapper">

    <span class="loading-letter loading-letter1">L</span>
    <span class="loading-letter loading-letter2">o</span>
    <span class="loading-letter loading-letter3">a</span>
    <span class="loading-letter loading-letter4">d</span>
    <span class="loading-letter loading-letter5">i</span>
    <span class="loading-letter loading-letter6">n</span>
    <span class="loading-letter loading-letter7">g</span>
    <span class="loading-letter loading-letter8">.</span>
    <span class="loading-letter loading-letter9">.</span>
    <span class="loading-letter loading-letter10">.</span>

  </div>

</div>


  


  <!-- =====================================================
       MAIN APP
  ====================================================== -->

  <div id="app" class="hidden">

    <!-- HEADER -->
    <header class="app-header">

      <div class="header-left">

        <div class="brand-area">

          <div class="brand-logo">
            SE⚡
          </div>

          <div class="brand-text">
            <h1>Sandeep ElectroFix</h1>
            <span>Project Material List</span>
          </div>

        </div>

      </div>


      <div class="header-right">

        <button
          id="languageBtn"
          class="header-btn"
          type="button"
        >
          EN
        </button>

        <button
          id="estimateBtn"
          class="icon-btn"
          type="button"
          aria-label="Estimate"
        >
          📋
        </button>

      </div>

    </header>


    <!-- MAIN -->
    <main class="main-content">

      <!-- PROJECT CARD -->
      <section class="project-card">

        <div class="project-title">

          <div>
            <span class="small-label">
              ELECTRICAL WORK
            </span>

            <h2 id="pageTitle">
              Project List
            </h2>
          </div>

          <div class="project-count">

            <span id="materialCount">
              69
            </span>

            <small>
              MATERIALS
            </small>

          </div>

        </div>


        <!-- SEARCH -->
        <div class="search-box">

          <span class="search-icon">
            🔍
          </span>

          <input
            id="searchInput"
            type="search"
            placeholder="Search material..."
            autocomplete="off"
          >

          <button
            id="clearSearch"
            class="clear-search"
            type="button"
          >
            ×
          </button>

        </div>

      </section>


      <!-- =================================================
           CONTENT AREA
      ================================================== -->

      <section class="section">

        <div class="section-heading">

          <button
            id="backBtn"
            class="back-btn hidden"
            type="button"
            aria-label="Back"
          >
            ←
          </button>

          <h3 id="sectionTitle">
            ⚡ Project Stages
          </h3>

        </div>


        <!-- STAGES -->
        <div
          id="stageList"
          class="stage-list"
        ></div>


        <!-- MATERIALS -->
        <div
          id="materialList"
          class="material-list hidden"
        ></div>


        <!-- OPTIONS -->
        <div
          id="optionList"
          class="option-list hidden"
        ></div>


        <!-- DETAILS -->
        <div
          id="detailsView"
          class="hidden"
        >

          <div class="details-card">

            <div class="selected-material">

              <span class="detail-label">
                Selected Material
              </span>

              <strong id="selectedMaterialName">
                —
              </strong>

            </div>


            <div id="dynamicForm"></div>


            <div class="form-row">

              <div class="form-group">

                <label for="quantityInput">
                  Quantity
                </label>

                <input
                  id="quantityInput"
                  type="number"
                  min="0"
                  step="any"
                  placeholder="Enter quantity"
                >

              </div>


              <div class="form-group">

                <label for="unitSelect">
                  Unit
                </label>

                <select id="unitSelect">
                  <option value="">
                    Select Unit
                  </option>
                </select>

              </div>

            </div>


            <div
              id="brandGroup"
              class="form-group hidden"
            >

              <label for="brandSelect">
                Brand
              </label>

              <select id="brandSelect">

                <option value="">
                  Select Brand
                </option>

              </select>

            </div>


            <div class="form-group">

              <label for="rateInput">
                Rate (₹)
              </label>

              <input
                id="rateInput"
                type="number"
                min="0"
                step="0.01"
                placeholder="Enter rate"
              >

            </div>


            <div class="form-group">

              <label>
                Amount
              </label>

              <div
                id="amountPreview"
                class="amount-preview"
              >
                ₹0.00
              </div>

            </div>


            <button
              id="addEstimateBtn"
              class="primary-btn"
              type="button"
            >
              ➕ Add to Estimate
            </button>

          </div>

        </div>


        <!-- =================================================
             ESTIMATE
        ================================================== -->

        <div
          id="estimateView"
          class="hidden"
        >

          <div
            id="selectedItemsList"
            class="selected-items-list"
          ></div>


          <div
            id="emptyEstimate"
            class="empty-state"
          >

            <div class="empty-icon">
              📋
            </div>

            <h4>
              Estimate Empty
            </h4>

            <p>
              Materials add करने के बाद आपका estimate यहाँ दिखाई देगा।
            </p>

          </div>


          <div
            id="totalCard"
            class="total-card hidden"
          >

            <div>

              <span>
                Grand Total
              </span>

              <small>
                Total Estimate Amount
              </small>

            </div>

            <strong id="grandTotal">
              ₹0.00
            </strong>

          </div>


          <div
            id="estimateActions"
            class="action-buttons hidden"
          >

            <button
              id="clearEstimateBtn"
              class="secondary-btn"
              type="button"
            >
              Clear
            </button>

            <button
              id="finalEstimateBtn"
              class="primary-btn"
              type="button"
            >
              Final Estimate
            </button>

          </div>

        </div>

      </section>

    </main>


    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-nav="home"
        type="button"
      >
        <span>🏠</span>
        <small>Home</small>
      </button>


      <button
        class="nav-item"
        data-nav="stages"
        type="button"
      >
        <span>📦</span>
        <small>Materials</small>
      </button>


      <button
        class="nav-item"
        data-nav="estimate"
        type="button"
      >
        <span>📋</span>
        <small>Estimate</small>
      </button>


      <button
        class="nav-item"
        data-nav="settings"
        type="button"
      >
        <span>⚙️</span>
        <small>Settings</small>
      </button>

    </nav>

  </div>


  <!-- =====================================================
       POPUP
  ====================================================== -->

  <div
    id="popupOverlay"
    class="popup-overlay hidden"
  >

    <div class="popup">

      <div class="popup-header">

        <h3 id="popupTitle">
          Details
        </h3>

        <button
          id="popupClose"
          class="popup-close"
          type="button"
        >
          ×
        </button>

      </div>

      <div
        id="popupContent"
        class="popup-content"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="materials.js"></script>
  <script src="script.js"></script>

</body>
</html>
